[package]
name = "zachdb"
version = "0.1.0"
edition = "2021"
description = "A lightweight, high-performance, non-relational database"
authors = ["Zach Wilke"]

[dependencies]
# Async runtime
tokio = { version = "1.28", features = ["full"] }
# Web framework for REST API
axum = "0.6.18"
# Serialization/deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Concurrent data structures
dashmap = "5.4.0"
# Persistence
bincode = "1.3.3"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# CLI argument parsing
clap = { version = "4.3", features = ["derive"] }
# Error handling
anyhow = "1.0"
thiserror = "1.0"
# Indexing
tantivy = "0.19"
# UUID generation
uuid = { version = "1.3", features = ["v4", "serde"] }
# Date and time support
chrono = "0.4"

[dev-dependencies]
# Testing utilities
hyper = "0.14"
futures = "0.3"
tower = "0.4"
# Load testing utilities
reqwest = { version = "0.11", features = ["json"] }
rand = "0.8"

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = 'unwind'
incremental = false
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
debug-assertions = true
overflow-checks = true
lto = false
panic = 'unwind'
incremental = true
codegen-units = 256
